{% extends "base.html" %}
{% block title %}Wachtwoord resetten – {{ site_name }}{% endblock %}
{% block content %}
<div class="container-sm" style="padding-top:70px">
  <div class="card">
    <div class="card-title"><i class="fas fa-lock"></i> Nieuw Wachtwoord</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Nieuw Wachtwoord</label>
        <input name="password" type="password" class="form-control" placeholder="Min. 6 tekens" required minlength="6" autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-save"></i> Wachtwoord Opslaan
      </button>
    </form>
  </div>
</div>
{% endblock %}
