{% extends "base.html" %}
{% block title %}Wachtwoord vergeten – {{ site_name }}{% endblock %}
{% block content %}
<div class="container-sm" style="padding-top:70px">
  <div class="card">
    <div class="card-title"><i class="fas fa-key"></i> Wachtwoord Vergeten</div>
    <p style="color:var(--text2);font-size:14px;margin-bottom:18px">Vul je e-mailadres in en we sturen je een resetlink.</p>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input name="email" type="email" class="form-control" placeholder="jouw@email.nl" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-full">
        <i class="fas fa-paper-plane"></i> Resetlink Sturen
      </button>
    </form>
    <div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text2)">
      <a href="{{ url_for('login') }}">Terug naar inloggen</a>
    </div>
  </div>
</div>
{% endblock %}
