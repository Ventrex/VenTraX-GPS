{% extends "base.html" %}
{% block title %}Inloggen – {{ site_name }}{% endblock %}
{% block content %}
<div class="container-sm" style="padding-top:72px">
  <div style="text-align:center;margin-bottom:32px">
    <img src="/static/img/logo_round.png" alt="VenTrax" style="width:90px;height:90px;border-radius:50%;object-fit:cover;margin:0 auto 14px">
    <div style="font-family:var(--hfont);font-size:36px;font-weight:800;letter-spacing:-1px">
      <span style="color:var(--text)">Ven</span><span style="color:var(--accent)">Faye</span>
    </div>
    <p style="color:var(--text2);margin-top:6px">Log in om te spelen</p>
  </div>
  <div class="card">
    <div class="card-title"><i class="fas fa-sign-in-alt"></i> Inloggen</div>
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Gebruikersnaam</label>
        <input name="username" class="form-control" placeholder="Jouw gebruikersnaam" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Wachtwoord</label>
        <div style="position:relative">
          <input name="password" id="pwf" type="password" class="form-control" placeholder="Wachtwoord" autocomplete="current-password" required style="padding-right:44px">
          <button type="button" onclick="tPw()" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px"><i class="fas fa-eye" id="pwEye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top:4px">
        <i class="fas fa-arrow-right"></i> Inloggen
      </button>
    </form>
    <div style="border-top:1px solid var(--border);margin-top:18px;padding-top:14px;text-align:center;font-size:14px;color:var(--text2);display:flex;flex-wrap:wrap;justify-content:center;gap:8px">
      <a href="{{ url_for('register') }}">Nog geen account? Registreren</a>
      <span style="color:var(--border)">·</span>
      <a href="{{ url_for('forgot_password') }}">Wachtwoord vergeten?</a>
    </div>
  </div>
</div>
<script>
function tPw(){const f=document.getElementById('pwf'),e=document.getElementById('pwEye');f.type=f.type==='password'?'text':'password';e.className=f.type==='password'?'fas fa-eye':'fas fa-eye-slash'}
</script>
{% endblock %}
