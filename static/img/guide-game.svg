<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="VenTrax game screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c12"/>
      <stop offset="100%" stop-color="#121827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="72" rx="22" fill="#0f1220" stroke="#2a2f41"/>
  <text x="76" y="86" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="30" font-weight="700">VenTrax game dashboard</text>
  <rect x="40" y="136" width="830" height="499" rx="28" fill="#101522" stroke="#2a2f41" filter="url(#shadow)"/>
  <rect x="892" y="136" width="268" height="499" rx="28" fill="#121826" stroke="#2a2f41" filter="url(#shadow)"/>
  <rect x="70" y="166" width="770" height="438" rx="22" fill="#1b3040" stroke="#33526f"/>
  <circle cx="260" cy="390" r="150" fill="#294356" stroke="#5b8fb1" stroke-dasharray="12 10" stroke-width="6"/>
  <circle cx="600" cy="275" r="12" fill="#3b82f6"/>
  <circle cx="510" cy="470" r="12" fill="#10b981"/>
  <circle cx="610" cy="280" r="26" fill="#3b82f6" opacity=".9"/>
  <circle cx="520" cy="480" r="26" fill="#10b981" opacity=".9"/>
  <text x="565" y="264" fill="#dbeafe" font-family="Arial, sans-serif" font-size="16" font-weight="700">Hunter</text>
  <text x="545" y="514" fill="#d1fae5" font-family="Arial, sans-serif" font-size="16" font-weight="700">Runner</text>
  <rect x="920" y="168" width="212" height="74" rx="18" fill="#0c1018" stroke="#2a2f41"/>
  <text x="942" y="202" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="15">Distance</text>
  <text x="942" y="228" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">248 m</text>
  <rect x="920" y="260" width="212" height="74" rx="18" fill="#0c1018" stroke="#2a2f41"/>
  <text x="942" y="294" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="15">Time left</text>
  <text x="942" y="320" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="28" font-weight="700">1:52:14</text>
  <rect x="920" y="352" width="212" height="74" rx="18" fill="#0c1018" stroke="#2a2f41"/>
  <text x="942" y="386" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="15">Target info</text>
  <text x="942" y="412" fill="#f59e0b" font-family="Arial, sans-serif" font-size="18" font-weight="700">Runner nog 4:12</text>
  <rect x="920" y="444" width="212" height="74" rx="18" fill="#0c1018" stroke="#2a2f41"/>
  <text x="942" y="478" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="15">GPS</text>
  <text x="942" y="504" fill="#10b981" font-family="Arial, sans-serif" font-size="28" font-weight="700">Active</text>
  <rect x="72" y="528" width="770" height="54" rx="16" fill="#0f1722" stroke="#2a2f41"/>
  <text x="94" y="562" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="16">Runner sees alerts here. Hunter sees target timer and runner panel.</text>
