<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="VenTrax lobby">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0c12"/>
      <stop offset="100%" stop-color="#151826"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#191d2c"/>
      <stop offset="100%" stop-color="#11131c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="160" fill="#e11d4840"/>
  <circle cx="170" cy="560" r="220" fill="#10b98125"/>
  <rect x="50" y="45" width="1100" height="86" rx="26" fill="#0f1220" stroke="#2a2f41"/>
  <text x="90" y="98" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="34" font-weight="700">VenTrax lobby</text>
  <text x="915" y="97" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="18">GPS required before ready</text>
  <rect x="65" y="160" width="360" height="470" rx="28" fill="url(#card)" stroke="#2a2f41" filter="url(#shadow)"/>
  <rect x="455" y="160" width="680" height="470" rx="28" fill="url(#card)" stroke="#2a2f41" filter="url(#shadow)"/>
  <rect x="95" y="200" width="300" height="120" rx="22" fill="#0c1018" stroke="#3d445d"/>
  <text x="135" y="245" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="16">Game code</text>
  <text x="118" y="295" fill="#f59e0b" font-family="Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="10">GUIDE1</text>
  <rect x="95" y="350" width="300" height="120" rx="22" fill="#121826" stroke="#3d445d"/>
  <text x="135" y="392" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="16">GPS gate</text>
  <rect x="120" y="410" width="250" height="36" rx="18" fill="#10b981"/>
  <text x="165" y="434" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="700">Allow location</text>
  <rect x="95" y="490" width="300" height="110" rx="22" fill="#121826" stroke="#3d445d"/>
  <text x="135" y="530" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="16">Players</text>
  <circle cx="145" cy="565" r="16" fill="#3b82f6"/>
  <text x="175" y="571" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18">guide_hunter</text>
  <circle cx="145" cy="598" r="16" fill="#10b981"/>
  <text x="175" y="604" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18">guide_runner</text>
  <rect x="490" y="205" width="600" height="330" rx="20" fill="#0f131d" stroke="#2a2f41"/>
  <rect x="520" y="235" width="540" height="36" rx="10" fill="#151b29"/>
  <text x="545" y="259" fill="#9aa3b2" font-family="Arial, sans-serif" font-size="16">Lobby checklist: GPS on, role chosen, ready pressed</text>
  <rect x="520" y="290" width="540" height="64" rx="16" fill="#101521" stroke="#2a2f41"/>
  <text x="546" y="328" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18">Hunter / Runner selection</text>
  <rect x="520" y="370" width="540" height="64" rx="16" fill="#101521" stroke="#2a2f41"/>
  <text x="546" y="408" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18">Ready button becomes active after GPS</text>
  <rect x="520" y="450" width="540" height="64" rx="16" fill="#101521" stroke="#2a2f41"/>
  <text x="546" y="488" fill="#f3f4f6" font-family="Arial, sans-serif" font-size="18">Game starts only when everyone is ready</text>
</svg>
